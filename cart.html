<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Gifted Eternity Story Time</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cart { max-width: 760px; margin: 0 auto; padding: 24px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #eee; }
        .cart-item h3 { margin: 0 0 4px; font-size: 1rem; }
        .cart-item .cat { color: #777; font-size: .85rem; }
        .cart-item button { border: 1px solid #ddd; background: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
        .cart-actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
        .cart-actions button { padding: 12px 20px; border-radius: 10px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 1rem; }
        .cart-actions .checkout { background: #6c5ce7; border-color: #6c5ce7; color: #fff; }
        .empty { color: #777; }
        .qty { display: inline-flex; align-items: center; gap: 8px; }
        .qty button { padding: 2px 9px; }
    </style>
</head>
<body>
    <header>
        <nav>
            <h1>Gifted Eternity Story Time</h1>
            <ul>
                <li><a href="story-time.html">Home</a></li>
                <li><a href="catalog.html">Stories Catalog</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
        </nav>
    </header>
    <main class="cart">
        <a href="catalog.html">&larr; Back to catalog</a>
        <h2>Your Cart</h2>
        <div id="cart-list"></div>
        <p id="cart-total"></p>
        <div class="cart-actions">
            <button id="clear-cart">Clear cart</button>
            <button class="checkout" id="checkout">Checkout by email</button>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 Gifted Eternity Story Time</p>
    </footer>
    <script src="js/stories-data.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
